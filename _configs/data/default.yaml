label_file_name: train.csv
series_data_folder_name: series/
preprocess_data_folder_name: raw_data/
niix_path: ${paths.data_root_dir}series_niix

num_classes: 14
num_fold: 1
current_fold: 0
input_channels: 32
img_size: 416
img_crop_size: 224
batch_size: 16
volume_depth: 96
volume_input_size: [96, 192, 192]

config:
  _target_: dataset.SeriesDataConfig

  data_path: ${paths.data_root_dir}
  niix_path: ${data.niix_path}
  label_file_name: ${data.label_file_name}
  label_weight_priority: []
  num_fold: ${data.num_fold}

transform:
  _target_: dataset.SeriesTransform

  img_size: ${data.img_size}
  img_crop_size: ${data.img_crop_size}

nifti_transform:
  _target_: dataset.NiftiTransform

  augmentations:
    resize:
      _target_: dataset.transform.augmentations.VolumeResize
      target_shape: ${data.volume_input_size}

nifti_train_dataset:
  _target_: dataset.NiftiDataset

  niix_path: ${data.niix_path}

nifti_valid_dataset:
  _target_: dataset.NiftiDataset

  niix_path: ${data.niix_path}
