
common:
  data_root_path: ${paths.data_root_dir}
  label_file_name: train.csv
  localizer_label_file_name: train_localizers.csv
  series_data_folder_name: series/
  preprocess_data_folder_name: raw_data/
  niix_path: ${paths.data_root_dir}series_niix
  
  num_classes: ${len:${data.common.label_class_names}}  # 14
  current_fold: 0
  input_channels: 3

  label_file_path: ${paths.data_root_dir}${data.common.label_file_name}
  label_class_names: [
    'Left Infraclinoid Internal Carotid Artery',
    'Right Infraclinoid Internal Carotid Artery',
    'Left Supraclinoid Internal Carotid Artery',
    'Right Supraclinoid Internal Carotid Artery',
    'Left Middle Cerebral Artery',
    'Right Middle Cerebral Artery',
    'Anterior Communicating Artery',
    'Left Anterior Cerebral Artery',
    'Right Anterior Cerebral Artery',
    'Left Posterior Communicating Artery',
    'Right Posterior Communicating Artery',
    'Basilar Tip',
    'Other Posterior Circulation',
    'Aneurysm Present',
  ]


classifier:
  _target_: dataset.SeriesDataManager

  input_data_folder_name: train_windows1_test1
  series_slide_fileset_path: H:/ml_data_resource/kaggle/intracranial_aneurysm_detection/raw_slide_data_cropped_loss_20260129_153709
  series_slide_metainfo_file_name: train_sampled_new.csv
  roi_crop_info_file_name: ''
  num_fold: 5
  current_fold: ${data.common.current_fold}
  batch_size: 16
  num_series_slide: 48

  base_transform:
    _target_: dataset.NiftiTransform
    
    augmentations:
      resize:
        _target_: dataset.transform.augmentations.ImageResize
        target_shape: [352, 352]
        forced_scale: True
  
  aug_transform:
    _target_: dataset.ImageMixedTransform
    
    augmentations:
      random_brightness_contrast:
        _target_: albumentations.RandomBrightnessContrast
        p: 0.15
      random_gamma:
        _target_: albumentations.RandomGamma
        p: 0.15
      gauss_noise:
        _target_: albumentations.GaussNoise
        p: 0.15
      shot_noise:
        _target_: albumentations.ShotNoise
        p: 0.15
      additive_noise:
        _target_: albumentations.AdditiveNoise
        p: 0.15
      multiplicative_noise:
        _target_: albumentations.MultiplicativeNoise
        p: 0.15
      equalize:
        _target_: albumentations.Equalize
        p: 0.15
      clahe:
        _target_: albumentations.CLAHE
        p: 0.15


vessel_segment:
  _target_: dataset.VesselSegmentDataManager

  volumes_path: ${paths.data_root_dir}segmentations_preprocessed/imagesTr
  labels_path: ${paths.data_root_dir}segmentations_preprocessed/labelsTr
  num_fold: 1
  batch_size: 1
  volume_input_size: [64, 128, 128]
  num_mask_classes: 14
  
  transform:
    _target_: dataset.NiftiTransform
  
    augmentations:
      random_crop:
        _target_: dataset.transform.augmentations.VolumeRandomCrop
        target_shape: ${data.vessel_segment.volume_input_size}
  
  train_dataset:
    _target_: dataset.VesselSegmentDataset
    
    label_class_names: ${data.common.label_class_names}
    volumes_path: ${data.vessel_segment.volumes_path}
    labels_path: ${data.vessel_segment.labels_path}
  
  valid_dataset:
    _target_: dataset.VesselSegmentDataset
    
    label_class_names: ${data.common.label_class_names}
    volumes_path: ${data.vessel_segment.volumes_path}
    labels_path: ${data.vessel_segment.labels_path}


vessel_roi_bbox:
  _target_: dataset.VesselROIBBoxDataManager

  metadata_file_path: ${paths.data_root_dir}segmentations_window1.csv
  num_fold: 1
  batch_size: 4
  num_series_slide: 48
  depth_size: 3
  image_size: [128, 128]

  train_dataset:
    _target_: dataset.VesselROIBBoxDataset
    
    num_series_slide: ${data.vessel_roi_bbox.num_series_slide}
    depth_size: ${data.vessel_roi_bbox.depth_size}
    image_size: ${data.vessel_roi_bbox.image_size}
  
  valid_dataset:
    _target_: dataset.VesselROIBBoxDataset
    
    num_series_slide: ${data.vessel_roi_bbox.num_series_slide}
    depth_size: ${data.vessel_roi_bbox.depth_size}
    image_size: ${data.vessel_roi_bbox.image_size}
