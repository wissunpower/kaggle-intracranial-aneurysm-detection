# @package _global_

defaults:
  - _self_
  - data: default
  - paths: default
  - hydra: default

experiment_name: preprocess_dcm_to_npy

train_target: ""

series_data_path: ${paths.data_root_dir}${data.common.series_data_folder_name}
# output_path: ${paths.data_root_dir}raw_data
output_path: D:/ml_data_resource/kaggle/intracranial_aneurysm_detection/raw_data_cropped

preprocess:
  _target_: dataset.preprocess.DICOMToNPYPreprocessor

  crop:
    enable: true
    info_file_path: ${paths.data_root_dir}series_to_crop_try5smallplusv7.npy
  resize:
    enable: false
    target_shape: [352, 352]
    mode: bilinear

result_dir: ${paths.result_dir}/${experiment_name}
